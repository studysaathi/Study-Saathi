<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study साथी — Learn Smart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8ff;color:#17213a}
.app{max-width:480px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #dce3f2}
.hero{padding:24px 20px 22px;background:linear-gradient(145deg,#173f8a,#2878e8);color:white;border-radius:0 0 30px 30px}
.brand{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800}.pill{background:#ffffff24;border:1px solid #ffffff45;padding:7px 10px;border-radius:20px;font-size:12px}
.hero h1{font-size:29px;line-height:1.15;margin:25px 0 8px}.hero p{margin:0 0 18px;opacity:.92}
.search{background:white;color:#6d7890;border-radius:14px;padding:13px 15px;display:flex;gap:9px;box-shadow:0 8px 20px #12366a44}
.section{padding:20px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title h2{margin:0;font-size:19px}.muted{font-size:12px;color:#718096}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;border-radius:18px;padding:15px;text-align:left;background:#f3f6ff;min-height:100px;cursor:pointer;transition:.15s}
.card:active{transform:scale(.98)}.card b{display:block;font-size:15px;margin:7px 0 4px}.card small{color:#68758d}
.icon{font-size:26px}.blue{background:#e9f1ff}.mint{background:#e7fbf1}.yellow{background:#fff5dc}.pink{background:#fff0f5}
.banner{background:linear-gradient(120deg,#fff1c9,#fff8e9);border-radius:20px;padding:17px;margin-bottom:18px}
.banner b{font-size:18px}.banner button,.primary{border:0;background:#1768d8;color:white;padding:11px 15px;border-radius:12px;font-weight:700;margin-top:10px;cursor:pointer}
.subject{min-height:75px;padding:13px}.subject .icon{font-size:21px}.subject b{margin:3px 0}
.back{border:0;background:#eef3fb;border-radius:12px;padding:10px 13px;margin-bottom:15px;cursor:pointer}
.list{display:grid;gap:10px}.list button{border:0;background:#f5f7fb;border-radius:15px;padding:15px;text-align:left;cursor:pointer}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:#fff;border-top:1px solid #e4e8f0;display:flex;justify-content:space-around;padding:8px 4px;z-index:5}.bottom button{border:0;background:none;font-size:11px;color:#52617a;padding:5px}.bottom b{display:block;font-size:20px}.space{height:65px}
.badge{display:inline-block;background:#e8f1ff;color:#1768d8;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="app"><div id="screen"></div><div class="space"></div>
<nav class="bottom">
<button onclick="home()"><b>⌂</b>Home</button><button onclick="classes()"><b>▦</b>Classes</button><button onclick="tests()"><b>✓</b>Tests</button><button onclick="ai()"><b>✦</b>AI Tutor</button><button onclick="profile()"><b>●</b>Profile</button>
</nav></div>
<script>
const groups=[
["Class 1–5","👦","मज़ेदार तरीके से सीखें"],
["Class 6–8","📚","Concept मजबूत करें"],
["Class 9–10","🎯","Board की तैयारी"],
["Class 11–12","🎓","Career की नींव"],
["ITI & Polytechnic","🔧","Skill + Practical"],
["Competitive Exams","🏆","Practice + Mock Test"]
];
const subs={
"Class 1–5":["हिंदी","English","Mathematics","EVS"],
"Class 6–8":["हिंदी","English","Mathematics","Science","Social Science"],
"Class 9–10":["हिंदी","English","Mathematics","Science","Social Science"],
"Class 11–12":["Physics","Chemistry","Mathematics","Biology","Commerce","Arts"],
"ITI & Polytechnic":["Mechanical","Electrical","Civil","Computer","Workshop","Practical & Viva"],
"Competitive Exams":["GK","Reasoning","Maths","English","Current Affairs"]
};
function home(){
screen.innerHTML=`<div class="hero"><div class="brand"><div class="logo">🎓 Study साथी</div><span class="pill">Free to start</span></div><h1>पढ़ाई आसान।<br>सपने बड़े। 🚀</h1><p>Class 1 से Polytechnic और Competitive Exams तक — एक ही जगह।</p><div class="search">🔎 <span>क्या पढ़ना है? Search करें...</span></div></div>
<div class="section"><div class="banner"><span class="badge">TODAY'S GOAL</span><br><b>आज 30 मिनट सीखें 💪</b><br><small>छोटी-सी daily practice, बड़ा improvement.</small><br><button onclick="planner()">आज का Study Plan →</button></div>
<div class="title"><h2>अपनी Class चुनें</h2><span class="muted">View all →</span></div><div class="grid">${groups.map((g,i)=>`<button class="card ${['blue','mint','yellow','pink'][i%4]}" onclick="subjects('${g[0]}')"><span class="icon">${g[1]}</span><b>${g[0]}</b><small>${g[2]}</small></button>`).join('')}</div>
<div class="title" style="margin-top:24px"><h2>Smart Tools ✨</h2></div><div class="grid">
<button class="card blue" onclick="ai()"><span class="icon">🤖</span><b>AI Tutor</b><small>सवाल पूछो, समझो</small></button>
<button class="card mint" onclick="tests()"><span class="icon">📝</span><b>Daily Test</b><small>10 MCQ रोज़</small></button>
<button class="card yellow" onclick="notes()"><span class="icon">📖</span><b>Notes & PYQ</b><small>Exam ready notes</small></button>
<button class="card pink" onclick="progress()"><span class="icon">📊</span><b>My Progress</b><small>अपनी growth देखें</small></button>
</div></div>`}
function classes(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>📚 Classes</h2><p class="muted">अपनी पढ़ाई का level चुनें</p><div class="list">${groups.map(g=>`<button onclick="subjects('${g[0]}')">${g[1]} <b>${g[0]}</b><br><small>${g[2]}</small></button>`).join('')}</div></div>`}
function subjects(c){screen.innerHTML=`<div class="section"><button class="back" onclick="classes()">← Classes</button><h2>${c}</h2><p class="muted">Subject चुनें</p><div class="grid">${subs[c].map(s=>`<button class="card subject blue" onclick="chapters('${c}','${s}')"><span class="icon">📘</span><b>${s}</b><small>Notes • MCQ • PYQ</small></button>`).join('')}</div></div>`}
function chapters(c,s){screen.innerHTML=`<div class="section"><button class="back" onclick="subjects('${c}')">← Subjects</button><span class="badge">${c}</span><h2>📘 ${s}</h2><div class="list"><button>📖 <b>Chapter 1 — Basic Concepts</b><br><small>Easy notes + examples</small></button><button>🎥 <b>Chapter 2 — Learn with Examples</b><br><small>Concept practice</small></button><button>📝 <b>Important Questions</b><br><small>Exam-focused practice</small></button><button>🏆 <b>Previous Year Questions</b><br><small>Test yourself</small></button></div></div>`}
function ai(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>🤖 AI Tutor</h2><p>आपका personal study साथी।</p><div class="card blue" style="min-height:0;margin-bottom:12px">💡 <b>आप कुछ भी पूछ सकते हैं</b><small>Maths, Science, English, Mechanical या किसी भी subject का doubt.</small></div><input id="q" placeholder="जैसे: Newton का दूसरा नियम आसान भाषा में समझाओ" style="width:100%;padding:14px;border:1px solid #d7deea;border-radius:12px"><button class="primary" style="width:100%" onclick="answer()">✨ समझाओ</button><div id="ans"></div>`}
function answer(){ans.innerHTML=`<div class="banner" style="margin-top:15px"><b>AI Tutor का Demo Answer</b><p>तुम्हारे सवाल को आसान भाषा में step-by-step समझाया जाएगा।</p><span class="badge">Step 1</span> Concept → <span class="badge">Step 2</span> Example → <span class="badge">Step 3</span> Practice</div>`}
function tests(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>📝 Daily Test</h2><p class="muted">आज के 10 questions से शुरुआत करें।</p><div class="card yellow"><span class="icon">🔥</span><b>Daily Challenge</b><small>10 MCQ • 5 minutes</small><button class="primary" onclick="alert('Demo test शुरू!')">Start Test →</button></div><br><div class="card blue"><b>🏆 Your Streak: 0 days</b><small>हर दिन practice करके streak बढ़ाएँ।</small></div></div>`}
function notes(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>📖 Notes & PYQ</h2><div class="list"><button>⭐ Most Important Questions</button><button>📚 Chapter-wise Notes</button><button>📝 Previous Year Papers</button><button>🧮 Solved Numericals</button></div></div>`}
function planner(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>📅 Today's Study Plan</h2><div class="list"><button>☀️ <b>Morning</b><br><small>30 min — Mathematics</small></button><button>📖 <b>Afternoon</b><br><small>30 min — Science</small></button><button>🌙 <b>Evening</b><br><small>20 min — MCQ Test</small></button></div></div>`}
function progress(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>📊 My Progress</h2><div class="grid"><div class="card blue"><span class="icon">⏱️</span><b>42 min</b><small>Study time</small></div><div class="card mint"><span class="icon">✓</span><b>28</b><small>Questions</small></div></div><div class="banner" style="margin-top:15px"><b>Keep going! 🚀</b><p>आज का goal पूरा करके अपनी streak शुरू करें।</p></div></div>`}
function profile(){screen.innerHTML=`<div class="section"><button class="back" onclick="home()">← Home</button><h2>👤 My Profile</h2><div class="card blue"><span class="icon">🎓</span><b>Study साथी Student</b><small>आपकी learning journey यहाँ दिखेगी।</small></div><div class="list" style="margin-top:14px"><button>⚙️ Settings</button><button>🔔 Notifications</button><button>🌐 Language: हिंदी</button></div></div>`}
home();
</script>
</body>
</html>
