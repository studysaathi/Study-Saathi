<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Saathi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.app{max-width:520px;margin:auto;min-height:100vh;background:white}.hero{padding:24px 20px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border-radius:0 0 28px 28px}.logo{font-size:28px;font-weight:800}.tag{margin-top:6px}.search{margin-top:18px;padding:14px;width:100%;border:0;border-radius:14px}.section{padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:16px;border:1px solid #e7eaf0;border-radius:18px;box-shadow:0 4px 14px #0001}.click{cursor:pointer}.icon{font-size:28px}.card h3{margin:8px 0 5px}.card p{margin:0;color:#687386;font-size:12px}.banner{margin-top:15px;padding:18px;border-radius:18px;background:#eef2ff}.primary{margin-top:12px;background:#4f46e5;color:white;border:0;border-radius:12px;padding:11px 15px}.nav{position:sticky;bottom:0;background:white;border-top:1px solid #eee;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}.nav button{background:white;border:0;color:#667085}.nav span{display:block;font-size:20px}</style></head><body><div class="app"><div id="content"></div><div class="nav"><button onclick="home()"><span>🏠</span>Home</button><button onclick="show('📚 Classes','Class 1–12, ITI और Polytechnic')"><span>▦</span>Classes</button><button onclick="show('✓ Daily Tests','MCQ और Mock Tests')"><span>✓</span>Tests</button><button onclick="show('🤖 AI Tutor','अपना सवाल आसान भाषा में पूछें')"><span>✦</span>AI Tutor</button><button onclick="show('👤 Profile','Progress और Study History')"><span>●</span>Profile</button></div></div><script>function home(){document.getElementById('content').innerHTML=`<section class="hero"><div class="logo">📚 Study Saathi</div><div class="tag">हर विद्यार्थी की पढ़ाई का साथी</div><input class="search" placeholder="🔎 विषय या chapter खोजें"></section><section class="section"><h2>अपनी पढ़ाई चुनें</h2><div class="grid"><div class="card click" onclick="show('🎒 Class 1–5','Maths • Hindi • English • EVS')"><div class="icon">🎒</div><h3>Class 1–5</h3><p>Basic subjects</p></div><div class="card click" onclick="show('📘 Class 6–8','Maths • Science • Social Science')"><div class="icon">📘</div><h3>Class 6–8</h3><p>Notes और practice</p></div><div class="card click" onclick="show('🏆 Class 9–10','Board • MCQ • Revision • PYQ')"><div class="icon">🏆</div><h3>Class 9–10</h3><p>Board preparation</p></div><div class="card click" onclick="show('🎓 Class 11–12','Science • Commerce • Arts')"><div class="icon">🎓</div><h3>Class 11–12</h3><p>Exam practice</p></div><div class="card click" onclick="show('🔧 ITI & Polytechnic','Technical subjects • Practical • Viva')"><div class="icon">🔧</div><h3>ITI & Polytechnic</h3><p>Technical preparation</p></div><div class="card click" onclick="show('📝 Competitive Exams','GK • Reasoning • Maths • Mock Tests')"><div class="icon">📝</div><h3>Competitive Exams</h3><p>Exam practice</p></div></div><div class="banner"><h3>🤖 AI Tutor</h3><p>सवाल पूछकर आसान भाषा में समझें।</p><button class="primary" onclick="show('🤖 AI Tutor','अपना सवाल पूछें')">AI Tutor खोलें</button></div></section>`}function show(t,p){document.getElementById('content').innerHTML=`<section class="hero"><div class="logo">${t}</div><div class="tag">Study Saathi</div></section><section class="section"><div class="card"><h3>📚 यहाँ से शुरुआत करें</h3><p>${p}</p><button class="primary" onclick="alert('इस section के chapters और notes जल्द जोड़े जाएंगे।')">Open</button><br><button class="primary" onclick="home()">← Home</button></div></section>`}home();</script></body></html>
